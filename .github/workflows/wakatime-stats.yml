name: Update stats

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    update-stats:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: update github stats
              uses: anmol098/waka-readme-stats@v5
              with:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

                  SECTION_NAME: "github"
                  SHOW_OS: "False"
                  SHOW_PROJECTS: "False"
                  SHOW_EDITORS: "False"
                  SHOW_TIMEZONE: "False"
                  SHOW_LANGUAGE: "False"
                  SHOW_LOC_CHART: "False"
                  SHOW_TOTAL_CODE_TIME: "False"
                  COMMIT_MESSAGE: "chore: update github stats"
                  UPDATED_DATE_FORMAT: "%Y-%m-%d %H:%M:%S"
                  SHOW_AI_CODE_TIME: "False"
                  SHOW_AI_CODING: "False"
        
            - name: update wakatime stats
              uses: anmol098/waka-readme-stats@v5
              with:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

                  SECTION_NAME: "wakatime"
                  SHOW_PROJECTS: "False"
                  SHOW_TIMEZONE: "False"
                  SHOW_COMMIT: "False"
                  SHOW_LANGUAGE_PER_REPO: "False"
                  SHOW_LOC_CHART: "False"
                  SHOW_DAYS_OF_WEEK: "False"
                  SHOW_PROFILE_VIEWS: "False"
                  SHOW_SHORT_INFO: "False"
                  COMMIT_MESSAGE: "chore: update wakatime stats"
                  UPDATED_DATE_FORMAT: "%Y-%m-%d %H:%M:%S"
                  SHOW_AI_CODE_TIME: "False"
                  SHOW_AI_CODING: "False"

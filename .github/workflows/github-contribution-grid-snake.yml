name: Generate github contribution grid snake

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    generate-github-contribution-grid-snake:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout main branch
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Generate github contribution grid snake
              uses: Platane/snk/svg-only@v3.5.0
              with:
                  github_user_name: ${{ github.repository_owner }}
                  outputs: |
                      assets/github-contribution-grid-snake/github-contribution-grid-snake.svg
                      assets/github-contribution-grid-snake/github-contribution-grid-snake-dark.svg?palette=github-dark

            - name: Commit and push generated images
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add assets/github-contribution-grid-snake

                  if git diff --staged --quiet; then
                      echo "No changes to commit."
                      exit 0
                  fi

                  git commit -m "chore: update github contribution grid snake"
                  git push origin main

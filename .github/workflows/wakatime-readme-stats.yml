name: Update WakaTime readme stats

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    update-wakatime-readme-stats:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 5
        
        steps:
            - name: update wakatime readme stats
              uses: anmol098/waka-readme-stats@v5
              with:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
                  SHOW_PROJECTS: "False"
                  SHOW_TIMEZONE: "False"
                  COMMIT_MESSAGE: "update wakatime readme stats"
                  COMMIT_USERNAME: "wakatime-readme-stats[bot]"
